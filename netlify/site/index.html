<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>中国每日新闻</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div>
          <p class="eyebrow">China Daily Brief</p>
          <h1>中国每日新闻</h1>
          <p class="intro">打开页面时自动获取最近 36 小时的中国及中国相关国际新闻。</p>
        </div>
        <button id="refresh" class="refresh" type="button">刷新</button>
      </header>

      <section class="status" aria-live="polite">
        <span id="meta">正在获取新闻…</span>
      </section>

      <div id="tags" class="tags" aria-label="分类筛选"></div>
      <section id="news" class="news"></section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
